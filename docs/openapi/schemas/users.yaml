# File: docs/openapi/schemas/users.yaml
# Purpose: Define user schemas for admin APIs.
# Why: Keeps user response/request shapes documented.

User:
  type: object
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    fullName:
      type: string
    role:
      $ref: './common.yaml#/UserRole'
    status:
      $ref: './common.yaml#/UserStatus'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    deletedAt:
      type: string
      format: date-time
      nullable: true
  required: [id, email, fullName, role, status, createdAt, updatedAt]

CreateUserRequest:
  type: object
  properties:
    email:
      type: string
      format: email
    fullName:
      type: string
    role:
      $ref: './common.yaml#/UserRole'
    status:
      $ref: './common.yaml#/UserStatus'
  required: [email, fullName, role, status]

InviteUserRequest:
  type: object
  description: Values are normalized before persistence; unknown properties are accepted and discarded.
  properties:
    email:
      type: string
      format: email
      description: Leading and trailing whitespace is removed and the value is lowercased.
      example: ' Teacher@Example.com '
    fullName:
      type: string
      minLength: 1
      pattern: '\S'
      description: Leading and trailing whitespace is removed; whitespace-only names are rejected.
      example: ' Invited Teacher '
    role:
      type: string
      enum: [teacher, student]
  required: [email, fullName, role]
  example:
    email: ' Teacher@Example.com '
    fullName: ' Invited Teacher '
    role: teacher
    department: English
