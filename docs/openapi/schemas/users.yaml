# File: docs/openapi/schemas/users.yaml
# Purpose: Define user schemas for admin APIs.
# Why: Keeps user response/request shapes documented.

User:
  type: object
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    fullName:
      $ref: './common.yaml#/DisplayName'
    role:
      $ref: './common.yaml#/UserRole'
    status:
      $ref: './common.yaml#/UserStatus'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    deletedAt:
      type: string
      format: date-time
      nullable: true
  required: [id, email, fullName, role, status, createdAt, updatedAt]

CreateUserRequest:
  type: object
  properties:
    email:
      type: string
      format: email
    fullName:
      $ref: './common.yaml#/NormalizedDisplayNameInput'
    role:
      $ref: './common.yaml#/UserRole'
    status:
      $ref: './common.yaml#/UserStatus'
  required: [email, fullName, role, status]

InviteUserRequest:
  type: object
  additionalProperties: true
  description: Clients normalize email and fullName before validation; the server repeats normalization, and unknown properties are accepted and discarded.
  properties:
    email:
      type: string
      format: email
      description: Supply a trimmed, lowercase value for contract validation; the server also trims and lowercases it.
      example: teacher@example.com
    fullName:
      $ref: './common.yaml#/NormalizedDisplayNameInput'
    role:
      type: string
      enum: [teacher, student]
  required: [email, fullName, role]
  example:
    email: teacher@example.com
    fullName: Invited Teacher
    role: teacher
    department: English

ManagedUserStatusRequest:
  type: object
  additionalProperties: false
  properties:
    status:
      type: string
      enum: [active, suspended]
  required: [status]
