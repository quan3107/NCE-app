# File: docs/openapi/schemas/ielts-config.yaml
# Purpose: Define reusable IELTS config schemas for OpenAPI.
# Why: Documents backend-driven option values consumed by IELTS authoring UIs.

IeltsConfigItem:
  type: object
  properties:
    id:
      type: string
    label:
      type: string
    description:
      type: string
    icon:
      type: string
    enabled:
      type: boolean
    sort_order:
      type: number
  required: [id, label, enabled, sort_order]

IeltsQuestionType:
  allOf:
    - $ref: '#/IeltsConfigItem'
    - type: object
      properties:
        skill_type:
          type: string
          enum: [reading, listening]
      required: [skill_type]

IeltsWritingTaskType:
  allOf:
    - $ref: '#/IeltsConfigItem'
    - type: object
      properties:
        task_number:
          type: number
      required: [task_number]

IeltsConfigResponse:
  type: object
  properties:
    version:
      type: number
    assignment_types:
      type: array
      items:
        $ref: '#/IeltsConfigItem'
    question_types:
      type: object
      properties:
        reading:
          type: array
          items:
            $ref: '#/IeltsQuestionType'
        listening:
          type: array
          items:
            $ref: '#/IeltsQuestionType'
      required: [reading, listening]
    writing_task_types:
      type: object
      properties:
        task1:
          type: array
          items:
            $ref: '#/IeltsWritingTaskType'
        task2:
          type: array
          items:
            $ref: '#/IeltsWritingTaskType'
      required: [task1, task2]
    speaking_part_types:
      type: array
      items:
        $ref: '#/IeltsConfigItem'
    completion_formats:
      type: array
      items:
        $ref: '#/IeltsConfigItem'
    sample_timing_options:
      type: array
      items:
        $ref: '#/IeltsConfigItem'
  required:
    - version
    - assignment_types
    - question_types
    - writing_task_types
    - speaking_part_types
    - completion_formats
    - sample_timing_options

IeltsConfigVersion:
  type: object
  properties:
    version:
      type: number
    name:
      type: string
    description:
      type: string
    is_active:
      type: boolean
    activated_at:
      type: string
      format: date-time
    created_at:
      type: string
      format: date-time
  required: [version, name, is_active, created_at]

IeltsConfigVersionsResponse:
  type: object
  properties:
    versions:
      type: array
      items:
        $ref: '#/IeltsConfigVersion'
    active_version:
      type: number
  required: [versions, active_version]

IeltsTypeTheme:
  type: object
  properties:
    color_from:
      type: string
    color_to:
      type: string
    border_color:
      type: string
  required: [color_from, color_to, border_color]

IeltsTypeMetadata:
  type: object
  properties:
    id:
      type: string
    title:
      type: string
    description:
      type: string
    icon:
      type: string
    theme:
      $ref: '#/IeltsTypeTheme'
    enabled:
      type: boolean
    sort_order:
      type: integer
  required: [id, title, description, icon, theme, enabled, sort_order]

IeltsTypeMetadataResponse:
  type: object
  properties:
    version:
      type: integer
      minimum: 1
    types:
      type: array
      items:
        $ref: '#/IeltsTypeMetadata'
  required: [version, types]

IeltsQuestionOption:
  type: object
  required: [value, label, score, enabled, sort_order]
  properties:
    value:
      type: string
      example: not_given
    label:
      type: string
      example: Not Given
    score:
      type: integer
      example: 0
    enabled:
      type: boolean
      example: true
    sort_order:
      type: integer
      example: 3

IeltsQuestionOptionsResponse:
  type: object
  required: [type, version, options]
  properties:
    type:
      type: string
      enum: [true_false, yes_no]
    version:
      type: integer
      minimum: 1
      example: 1
    options:
      type: array
      items:
        $ref: '#/IeltsQuestionOption'
      minItems: 1

IeltsConfigErrorResponse:
  type: object
  properties:
    error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required: [code, message, details]
  required: [error]
