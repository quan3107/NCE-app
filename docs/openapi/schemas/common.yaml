# File: docs/openapi/schemas/common.yaml
# Purpose: Define shared enums and error shapes for the API.
# Why: Centralizes common schema types used across multiple domains.

ErrorResponse:
  type: object
  properties:
    message:
      type: string
    details:
      type: object
      additionalProperties: true
      nullable: true
  required: [message]

UserRole:
  type: string
  enum: [admin, teacher, student]

UserStatus:
  type: string
  enum: [active, pending, invited, suspended]

DisplayName:
  type: string
  minLength: 2
  maxLength: 100
  pattern: '^(?=\S(?:[\s\S]*\S)?$)(?![\s\S]*[\p{Cc}\p{Cf}\p{Zl}\p{Zp}])(?:[^\u0000\uD800-\uDFFF]|[\uD800-\uDBFF][\uDC00-\uDFFF])*$'
  description: Canonical display name with no surrounding whitespace, measured as 2-100 Unicode code points, restricted to PostgreSQL-safe Unicode scalar values, and excluding non-printing and bidirectional controls.

EnrollmentRole:
  type: string
  enum: [teacher, student]

AssignmentType:
  type: string
  enum: [file, link, text, quiz, reading, listening, writing, speaking]

SubmissionStatus:
  type: string
  enum: [draft, submitted, late, graded]

NotificationChannel:
  type: string
  enum: [inapp, email, push, sms]

NotificationStatus:
  type: string
  enum: [queued, sending, sent, failed, read, suppressed, dead_letter, delivery_unknown]
