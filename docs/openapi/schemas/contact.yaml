# File: docs/openapi/schemas/contact.yaml
# Purpose: Define public contact submission request and response contracts.
# Why: The frontend needs documented bounds and truthful persisted/spam-routed outcomes.

ContactSubmissionRequest:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 120
    email:
      type: string
      format: email
      maxLength: 254
    subject:
      type: string
      minLength: 3
      maxLength: 160
    message:
      type: string
      minLength: 10
      maxLength: 5000
    website:
      type: string
      maxLength: 500
      description: Honeypot field that normal users must leave empty.
  required: [name, email, subject, message]

ContactSubmissionCreated:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    status:
      type: string
      enum: [new]
    submittedAt:
      type: string
      format: date-time
  required: [id, status, submittedAt]

ContactSubmissionAccepted:
  type: object
  additionalProperties: false
  properties:
    accepted:
      type: boolean
      enum: [true]
  required: [accepted]
