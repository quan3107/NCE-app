# File: docs/openapi/schemas/contact.yaml
# Purpose: Define public contact submission request and response contracts.
# Why: The frontend needs documented bounds and truthful persisted/spam-routed outcomes.

ContactSubmissionRequest:
  type: object
  additionalProperties: false
  properties:
    idempotencyKey:
      type: string
      format: uuid
      description: Stable identifier reused when retrying the same unchanged submission.
    name:
      type: string
      minLength: 2
      maxLength: 120
      description: Canonical value without leading or trailing whitespace.
    email:
      type: string
      format: email
      maxLength: 254
      description: Canonical email without surrounding whitespace; normalized to lowercase for storage.
    subject:
      type: string
      minLength: 3
      maxLength: 160
      description: Canonical value without leading or trailing whitespace.
    message:
      type: string
      minLength: 10
      maxLength: 5000
      description: Canonical value without leading or trailing whitespace.
    website:
      type: string
      maxLength: 500
      description: Honeypot field that normal users must leave empty.
  required: [idempotencyKey, name, email, subject, message]

ContactSubmissionAccepted:
  type: object
  additionalProperties: false
  properties:
    accepted:
      type: boolean
      enum: [true]
  required: [accepted]
