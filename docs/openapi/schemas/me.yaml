# File: docs/openapi/schemas/me.yaml
# Purpose: Define the /me response schema for the API.
# Why: Documents authenticated profile and enrollment payloads.

MeProfile:
  type: object
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    fullName:
      type: string
    role:
      $ref: './common.yaml#/UserRole'
    status:
      $ref: './common.yaml#/UserStatus'
  required: [id, email, fullName, role, status]

UpdateMeProfileRequest:
  type: object
  additionalProperties: false
  properties:
    fullName:
      type: string
      minLength: 2
      maxLength: 100
      pattern: '^\S(?:[\s\S]*\S)?$'
      description: Canonical display name with no surrounding whitespace, measured as 2-100 Unicode code points.
  required: [fullName]

MeResponse:
  type: object
  properties:
    profile:
      $ref: '#/MeProfile'
    roles:
      type: object
      properties:
        global:
          $ref: './common.yaml#/UserRole'
        courses:
          type: array
          items:
            type: object
            properties:
              courseId:
                type: string
                format: uuid
              roleInCourse:
                $ref: './common.yaml#/EnrollmentRole'
            required: [courseId, roleInCourse]
      required: [global, courses]
    enrollments:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
          courseId:
            type: string
            format: uuid
          roleInCourse:
            $ref: './common.yaml#/EnrollmentRole'
          course:
            type: object
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
            required: [id, title]
          enrolledAt:
            type: string
            format: date-time
        required: [id, courseId, roleInCourse, course, enrolledAt]
  required: [profile, roles, enrollments]
