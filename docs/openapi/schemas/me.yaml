# File: docs/openapi/schemas/me.yaml
# Purpose: Define the /me response schema for the API.
# Why: Documents authenticated profile and enrollment payloads.

MeProfile:
  type: object
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    fullName:
      $ref: './common.yaml#/DisplayName'
    role:
      $ref: './common.yaml#/UserRole'
    status:
      $ref: './common.yaml#/UserStatus'
    profileRevision:
      type: integer
      minimum: 0
      description: Monotonic version of editable profile fields.
  required: [id, email, fullName, role, status, profileRevision]

UpdateMeProfileRequest:
  type: object
  additionalProperties: false
  properties:
    fullName:
      $ref: './common.yaml#/CanonicalDisplayName'
    expectedRevision:
      type: integer
      minimum: 0
      description: Profile revision returned by the latest accepted GET or PATCH.
  required: [fullName, expectedRevision]

MeResponse:
  type: object
  properties:
    profile:
      $ref: '#/MeProfile'
    roles:
      type: object
      properties:
        global:
          $ref: './common.yaml#/UserRole'
        courses:
          type: array
          items:
            type: object
            properties:
              courseId:
                type: string
                format: uuid
              roleInCourse:
                $ref: './common.yaml#/EnrollmentRole'
            required: [courseId, roleInCourse]
      required: [global, courses]
    enrollments:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
          courseId:
            type: string
            format: uuid
          roleInCourse:
            $ref: './common.yaml#/EnrollmentRole'
          course:
            type: object
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
            required: [id, title]
          enrolledAt:
            type: string
            format: date-time
        required: [id, courseId, roleInCourse, course, enrolledAt]
  required: [profile, roles, enrollments]
