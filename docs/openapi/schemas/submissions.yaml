# File: docs/openapi/schemas/submissions.yaml
# Purpose: Define submission schemas for the API.
# Why: Documents submission payloads used by assignment workflows.

Submission:
  type: object
  properties:
    id:
      type: string
      format: uuid
    assignmentId:
      type: string
      format: uuid
    studentId:
      type: string
      format: uuid
    status:
      $ref: './common.yaml#/SubmissionStatus'
    submittedAt:
      type: string
      format: date-time
      nullable: true
    payload:
      description: Validated submission payload (shape depends on assignment type).
      anyOf:
        - $ref: '#/IeltsSubmissionPayload'
        - $ref: '#/GenericSubmissionResponsePayload'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    deletedAt:
      type: string
      format: date-time
      nullable: true
  required: [id, assignmentId, studentId, status, payload, createdAt, updatedAt]

CreateSubmissionRequest:
  type: object
  additionalProperties: false
  properties:
    payload:
      description: Validated submission payload (shape depends on assignment type).
      anyOf:
        - $ref: '#/IeltsSubmissionPayload'
        - $ref: '#/GenericSubmissionPayload'
    submittedAt:
      type: string
      format: date-time
    status:
      type: string
      enum: [draft, submitted, late]
  required: [payload]

GenericSubmissionPayload:
  oneOf:
    - $ref: '#/TextSubmissionPayload'
    - $ref: '#/LinkSubmissionPayload'
    - $ref: '#/FileSubmissionPayload'

GenericSubmissionResponsePayload:
  oneOf:
    - $ref: '#/TextSubmissionPayload'
    - $ref: '#/LinkSubmissionPayload'
    - $ref: '#/FileSubmissionResponsePayload'

GenericSubmissionVersion:
  type: integer
  minimum: 1

TextSubmissionPayload:
  type: object
  additionalProperties: false
  properties:
    version:
      $ref: '#/GenericSubmissionVersion'
    content:
      type: string
      minLength: 1
      maxLength: 100000
  required: [content]

LinkSubmissionPayload:
  type: object
  additionalProperties: false
  properties:
    version:
      $ref: '#/GenericSubmissionVersion'
    link:
      type: string
      format: uri
      maxLength: 2048
      pattern: '^https?://'
  required: [link]

SubmissionFileReference:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
  required: [id]

FileSubmissionPayload:
  type: object
  additionalProperties: false
  properties:
    version:
      $ref: '#/GenericSubmissionVersion'
    files:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        $ref: '#/SubmissionFileReference'
  required: [files]

CanonicalSubmissionFile:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    size:
      type: integer
      minimum: 1
    mime:
      type: string
    checksum:
      type: string
    bucket:
      type: string
    objectKey:
      type: string
  required: [id, name, size, mime, checksum, bucket, objectKey]

FileSubmissionResponsePayload:
  type: object
  additionalProperties: false
  properties:
    version:
      $ref: '#/GenericSubmissionVersion'
    files:
      type: array
      minItems: 1
      items:
        $ref: '#/CanonicalSubmissionFile'
  required: [version, files]

IeltsSubmissionPayload:
  oneOf:
    - $ref: '#/IeltsReadingSubmissionPayload'
    - $ref: '#/IeltsListeningSubmissionPayload'
    - $ref: '#/IeltsWritingSubmissionPayload'
    - $ref: '#/IeltsSpeakingSubmissionPayload'

IeltsSubmissionBase:
  type: object
  properties:
    version:
      type: integer
      enum: [1]
    attempt:
      type: integer
      minimum: 1
    startedAt:
      type: string
      format: date-time
    submittedAt:
      type: string
      format: date-time
    durationSeconds:
      type: integer
      minimum: 0
  additionalProperties: true

IeltsAnswer:
  type: object
  properties:
    questionId:
      type: string
    value:
      oneOf:
        - type: string
          nullable: true
        - type: number
        - type: boolean
        - type: array
          items: {}
        - type: object
          additionalProperties: true
  required: [questionId, value]
  additionalProperties: true

IeltsReadingSubmissionPayload:
  allOf:
    - $ref: '#/IeltsSubmissionBase'
    - type: object
      properties:
        answers:
          type: array
          items:
            $ref: '#/IeltsAnswer'
      required: [answers]

IeltsListeningSubmissionPayload:
  allOf:
    - $ref: '#/IeltsSubmissionBase'
    - type: object
      properties:
        answers:
          type: array
          items:
            $ref: '#/IeltsAnswer'
      required: [answers]

IeltsWritingTaskResponse:
  type: object
  properties:
    text:
      type: string
  required: [text]
  additionalProperties: true

IeltsWritingSubmissionPayload:
  allOf:
    - $ref: '#/IeltsSubmissionBase'
    - type: object
      properties:
        task1:
          $ref: '#/IeltsWritingTaskResponse'
        task2:
          $ref: '#/IeltsWritingTaskResponse'
      required: [task1, task2]

IeltsSpeakingRecording:
  type: object
  properties:
    part:
      type: string
      enum: [part1, part2, part3]
    fileId:
      type: string
      format: uuid
    durationSeconds:
      type: integer
      minimum: 1
  required: [part, fileId, durationSeconds]
  additionalProperties: true

IeltsSpeakingSubmissionPayload:
  allOf:
    - $ref: '#/IeltsSubmissionBase'
    - type: object
      properties:
        recordings:
          type: array
          items:
            $ref: '#/IeltsSpeakingRecording'
        notes:
          type: object
          additionalProperties:
            type: string
      required: [recordings]
