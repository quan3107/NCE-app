# File: docs/openapi/paths/password-recovery.yaml
# Purpose: Document public password recovery endpoints.
# Why: Preserve anti-enumeration and session revocation contracts.
RequestReset:
  post:
    tags: [auth]
    summary: Request a password reset link
    security: []
    description: >
      Returns the same message for unknown, inactive, Google-only, cooldown, and
      eligible accounts. Brevo delivery is asynchronous and best-effort. Links
      expire in 30 minutes. Recipient cooldown is 60 seconds; IP authentication
      limits also apply. Links use the first configured CORS origin and a token fragment.
      The origin must use HTTPS in production.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email, maxLength: 320 }
    responses:
      "200":
        description: Generic acknowledgment, independent of account existence or delivery outcome
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      "400":
        description: Invalid email input
      "429":
        description: Too many requests; authentication rate limit reached
      "500":
        description: Service unavailable
      "503":
        description: Recovery origin is missing or does not use HTTPS in production
ResetPassword:
  post:
    tags: [auth]
    summary: Consume a password reset link
    security: []
    description: >
      Replaces an active password account's password, consumes its reset token,
      and revokes every existing refresh and access-token session atomically.
      Does not create a session or convert Google-only accounts to password accounts.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token, password]
            properties:
              token: { type: string, pattern: "^[a-f0-9]{64}$" }
              password: { type: string, minLength: 8, format: password }
    responses:
      "200":
        description: Password changed; sign in with the new password
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      "400":
        description: Invalid password or invalid, expired, consumed, or ineligible reset link
      "429":
        description: Too many requests; authentication rate limit reached
      "500":
        description: Service unavailable; no partial password or session change committed
