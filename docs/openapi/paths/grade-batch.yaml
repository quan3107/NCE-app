# File: docs/openapi/paths/grade-batch.yaml
# Purpose: Document bounded list grade reads.
# Why: Lists retain single-grade authorization/visibility without per-row HTTP fanout.

GradeBatch:
  post:
    tags: [grades]
    summary: Read up to 100 submission grades
    description: >
      Admin, teacher course scope and student ownership match the individual grade
      endpoint. Duplicate IDs are deduplicated in request order. Missing/deleted or
      inaccessible grades are omitted, without revealing their existence. Student
      responses retain sanitized instant-visible provisional feedback and current
      assignment policy gates; teacher-only drafts are never added. Reading activity
      is recorded once per accessible course. Split larger lists into bounded batches.
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [submissionIds]
            properties:
              submissionIds:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  type: string
                  format: uuid
    responses:
      "200":
        description: Accessible official or provisional grades in deduplicated request order
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    description: Same response fields as the individual grade endpoint, including provisionalOnly and sanitized studentAiFeedback when present.
                    required: [submissionId]
                    properties:
                      submissionId:
                        type: string
                        format: uuid
                      provisionalOnly:
                        type: boolean
                      studentAiFeedback:
                        type: object
      "400":
        description: Invalid IDs, empty list, more than 100 IDs, or unknown fields
      "401":
        description: Authentication required
      "403":
        description: Caller role cannot read grades
