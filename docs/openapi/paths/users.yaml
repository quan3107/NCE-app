# File: docs/openapi/paths/users.yaml
# Purpose: Define user administration OpenAPI path items.
# Why: Captures admin-only user management endpoints.

Users:
  get:
    tags: [users]
    summary: List users (admin)
    responses:
      '200':
        description: Users
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/users.yaml#/User'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
    security:
      - BearerAuth: []
  post:
    tags: [users]
    summary: Create user (admin)
    description: Admin-only provisioning flow for student, teacher, and administrator accounts.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/users.yaml#/CreateUserRequest'
    responses:
      '201':
        description: User created
        content:
          application/json:
            schema:
              $ref: '../schemas/users.yaml#/User'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '409':
        description: Conflict
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
    security:
      - BearerAuth: []

UserById:
  get:
    tags: [users]
    summary: Get user (admin)
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: User
        content:
          application/json:
            schema:
              $ref: '../schemas/users.yaml#/User'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
    security:
      - BearerAuth: []
  delete:
    tags: [users]
    summary: Soft-delete a non-admin user (admin)
    description: Revokes all live sessions immediately. Administrator accounts and the caller's own account cannot be deleted through this endpoint.
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: User deleted and sessions revoked
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '409':
        description: Protected administrator account or concurrent change
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
    security:
      - BearerAuth: []

UserStatusManagement:
  patch:
    tags: [users]
    summary: Suspend or reactivate a non-admin user (admin)
    description: Suspending a user revokes all live sessions immediately. Administrator accounts and the caller's own account cannot be changed through this endpoint.
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/users.yaml#/ManagedUserStatusRequest'
    responses:
      '200':
        description: Updated user
        content:
          application/json:
            schema:
              $ref: '../schemas/users.yaml#/User'
      '400':
        description: Invalid status transition request
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '409':
        description: Protected administrator account or stale transition
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
    security:
      - BearerAuth: []

UserInvite:
  post:
    tags: [users]
    summary: Invite a student or teacher (admin)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/users.yaml#/InviteUserRequest'
    responses:
      '201':
        description: Invited user created
        content:
          application/json:
            schema:
              $ref: '../schemas/users.yaml#/User'
      '400':
        description: Invitation payload failed validation
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '409':
        description: An account with the email already exists
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '500':
        description: User invitation failed unexpectedly
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
    security:
      - BearerAuth: []

TeacherApproval:
  post:
    tags: [users]
    summary: Approve a pending teacher account (admin)
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Teacher account activated
        content:
          application/json:
            schema:
              $ref: '../schemas/users.yaml#/User'
      '400':
        description: Teacher identifier failed validation
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '404':
        description: Teacher request not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '409':
        description: Teacher request is no longer pending
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '500':
        description: Teacher approval failed unexpectedly
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
    security:
      - BearerAuth: []

TeacherRejection:
  post:
    tags: [users]
    summary: Reject a pending teacher account (admin)
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Teacher account suspended
        content:
          application/json:
            schema:
              $ref: '../schemas/users.yaml#/User'
      '400':
        description: Teacher identifier failed validation
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '404':
        description: Teacher request not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '409':
        description: Teacher request is no longer pending
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '500':
        description: Teacher rejection failed unexpectedly
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
    security:
      - BearerAuth: []
