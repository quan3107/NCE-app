# File: docs/openapi/paths/settings.yaml
# Purpose: Define administrator runtime setting operations.
# Why: Role upload limits are persisted and consumed by upload enforcement.

FileUploadLimits:
  get:
    tags: [settings]
    summary: Get role-based file upload limits
    responses:
      '200':
        description: Persisted role upload limits
        content:
          application/json:
            schema:
              $ref: '../schemas/settings.yaml#/FileUploadLimitsResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '403':
        description: Administrator access required
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '500':
        description: Stored upload limits are unavailable or noncanonical
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
    security:
      - BearerAuth: []
  patch:
    tags: [settings]
    summary: Update role-based file upload limits
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/settings.yaml#/FileUploadLimitUpdates'
    responses:
      '200':
        description: Persisted role upload limits
        content:
          application/json:
            schema:
              $ref: '../schemas/settings.yaml#/FileUploadLimitsResponse'
      '400':
        description: Invalid role limit update
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '403':
        description: Administrator access required
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '409':
        description: A role limit conflicts with a concurrently saved value
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '500':
        description: Upload-limit persistence or audit failed
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
    security:
      - BearerAuth: []
